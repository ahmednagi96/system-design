name: Uptime Check

on:
  schedule:
    - cron: "*/15 * * * *"     # كل 15 دقيقة
  workflow_dispatch:            # وزرار يدوي للتجربة

jobs:
  check:
    name: Is the site up?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check health
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 15 \
            https://13-140-223-133.sslip.io/health/ready
          echo ""
          echo "✅ الموقع شغال"