name: CI

on:
  pull_request:
    branches: [ main ]          # شغّل على أي PR رايح لـ main
  push:
    branches: [ main ]          # وشغّل بعد أي merge على main
  workflow_dispatch:            # زرار تشغيل يدوي من تبويب Actions

permissions:
  contents: read                # أقل صلاحيات ممكنة: قراءة الكود بس

concurrency:
  group: ci-${{ github.ref }}   # لو عملت push جديد على نفس الفرع...
  cancel-in-progress: true      # ...الغي التشغيل القديم ووفّر وقت

env:
  DOTNET_NOLOGO: true                 # من غير رسالة الترحيب بتاعت dotnet
  DOTNET_CLI_TELEMETRY_OPTOUT: true   # من غير إرسال بيانات استخدام

jobs:
  build-and-test:
    name: Build & Test          # الاسم ده هنستخدمه في الـ Ruleset
    runs-on: ubuntu-latest
    timeout-minutes: 15         # لو حاجة علّقت، متاكلش وقت للأبد

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'  # هنغيرها لـ 10.0.x في درس 3.5

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal
