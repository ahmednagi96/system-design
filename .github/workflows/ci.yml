name: CI

on:
  pull_request:
    branches: [ main ]          # شغّل على أي PR رايح لـ main
  push:
    branches: [ main ]          # وشغّل بعد أي merge على main
  workflow_dispatch:            # زرار تشغيل يدوي من تبويب Actions

permissions:
  contents: read                # أقل صلاحيات ممكنة: قراءة الكود بس

concurrency:
  group: ci-${{ github.ref }}   # لو عملت push جديد على نفس الفرع...
  cancel-in-progress: true      # ...الغي التشغيل القديم ووفّر وقت

env:
  DOTNET_NOLOGO: true                 # من غير رسالة الترحيب بتاعت dotnet
  DOTNET_CLI_TELEMETRY_OPTOUT: true   # من غير إرسال بيانات استخدام

jobs:
  build-and-test:
    name: Build & Test          # الاسم ده هنستخدمه في الـ Ruleset
    runs-on: ubuntu-latest
    timeout-minutes: 15         # لو حاجة علّقت، متاكلش وقت للأبد

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'  # هنغيرها لـ 10.0.x في درس 3.5

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal
  docker:
    name: Docker Image
    needs: build-and-test          # ميبدأش غير لما الاختبارات تنجح
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read               # يقرا الكود
      packages: write              # يرفع على GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # أداة بناء متطورة من Docker (بتدعم الكاش)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # تسجيل الدخول لـ GHCR (في main بس، الـ PR مش محتاج يرفع)
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # بيحسب اسم الصورة والتاجات لوحده
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # البناء + الرفع
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/SystemDesign.API/Dockerfile
          push: ${{ github.event_name == 'push' }}   # يرفع في main بس
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha                       # استخدم كاش التشغيل اللي فات
          cache-to: type=gha,mode=max                # واحفظ كاش للمرة الجاية  
  deploy:
    name: Deploy
    needs: docker                        # بعد ما الصورة تترفع
    if: github.event_name == 'push'      # في main بس، مش في الـ PR
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # نجهّز مفتاح الدخول
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

           # ننسخ ملفات النشر للسيرفر (compose + Caddyfile)
      - name: Copy deploy files
        run: |
          scp deploy/docker-compose.prod.yml \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/app/docker-compose.yml"
          scp deploy/Caddyfile \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/app/Caddyfile"
      # النشر نفسه
      - name: Deploy on server
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA::7}"
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "
            cd ~/app &&
            export IMAGE_TAG=$IMAGE_TAG &&
            docker compose pull &&
            docker compose up -d &&
            docker image prune -f
          "        
